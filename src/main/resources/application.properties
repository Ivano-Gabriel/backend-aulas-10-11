server.port=${PORT:8080}
spring.application.name=backend-aulas-10-11

# A URL padrão serve ao Maven/JAR local. No Compose a API usa o host 'db'.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/tarefas_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
logging.level.root=INFO
logging.level.br.com.ivano.tarefas=INFO
